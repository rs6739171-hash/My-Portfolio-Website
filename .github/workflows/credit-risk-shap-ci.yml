name: Credit Risk SHAP CI

on:
  push:
    branches: [credit-risk-shap]
    paths:
      - "projects/Explainable_Credit_Risk_SHAP/**"
      - ".github/workflows/credit-risk-shap-ci.yml"
  pull_request:
    paths:
      - "projects/Explainable_Credit_Risk_SHAP/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Explainable_Credit_Risk_SHAP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python train_model.py
      - run: python -m unittest discover -s tests -v
      - run: python -m evals.run_eval
      - run: python -m compileall -q app evals train_model.py serve.py
