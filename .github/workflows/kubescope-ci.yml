name: KubeScope checks
on:
  push:
    paths: ['projects/AI_DevOps_Kubernetes_Agent/**', '.github/workflows/kubescope-ci.yml']
  pull_request:
    paths: ['projects/AI_DevOps_Kubernetes_Agent/**', '.github/workflows/kubescope-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/AI_DevOps_Kubernetes_Agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/AI_DevOps_Kubernetes_Agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
