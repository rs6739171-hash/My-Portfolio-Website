# Apply only in the namespace you intend to inspect; do not grant cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescope-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubescope-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubescope-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: kubescope-reader
    namespace: default
roleRef:
  kind: Role
  name: kubescope-reader
  apiGroup: rbac.authorization.k8s.io
